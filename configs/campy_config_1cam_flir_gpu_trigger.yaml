# This beginner-level config uses the GPU (gpuID: 0) to compress video
# using ffmpeg's H265 codec

# Recording parameters
videoFolder: "./videos"
videoFilename: "0.mp4"
frameRate: 60
recTimeInSec: 600
#chunkLengthInSec: 600

# Camera parameters
numCams: 1
cameraMake: "flir"
frameWidth: 2048
frameHeight: 1536
pixelFormatInput: "gray" # "bayer_rggb8" # 
pixelFormatOutput: "rgb0"

# Flir settings
cameraSettings: "UserSet1"
#cameraTrigger: "Line3"
bufferSize: 200
cameraExposureTimeInUs: 3001
cameraGain: 5.5
disableGamma: True # False 
#gammaLevel: 1.5
cameraDebug: True # True # 

# Compression parameters
gpuID: 0                              
gpuMake: "nvidia"                     # "nvidia", "amd", "intel"                  
codec: "av1"                          # "h264", "h265", "av1", or user-defined video codec
quality: "30"
#qualityMode: "vbr"
qualityMode: "constqp"
#qualityMode: "cbr"
preset: "p7"

ffmpegLogLevel: "info"               # "quiet", "warning", "info"
# ffmpegPath: "C:/Code/ffmpeg"       # Location of ffmpeg binary if not using Anaconda

# Display parameters
displayFrameCounter: 1
displayFrameRate: 10

# Trigger Parameters
#startArduino: True
#serialPort: "COM3"                    # e.g. "COM3" Win; "/dev/ttyACM0" Linux
#digitalPins: [0,1,2]
